<script>
// =======================================================
// CẤU HÌNH GITHUB
// =======================================================

const GITHUB_CONFIG = {
    owner: "itselena-tran",
    repo: "elena-hsk-platform",
    branch: "main",
    folder: ""
};

// =======================================================
// URL GITHUB PAGES
// =======================================================

const PAGES_BASE_URL =
`https://${GITHUB_CONFIG.owner}.github.io/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.folder ? GITHUB_CONFIG.folder + "/" : ""}`;


// =======================================================
// DANH SÁCH HSK
// =======================================================

const LEVELS = [

    {
        key: "hsk1",
        file: "hsk1.html",
        label: "HSK 1",
        range: "Từ vựng 1 - 300"
    },

    {
        key: "hsk2",
        file: "hsk2.html",
        label: "HSK 2",
        range: "Từ vựng 301 - 500"
    },

    {
        key: "hsk3",
        file: "hsk3.html",
        label: "HSK 3",
        range: "Từ vựng 501 - 1000"
    },

    {
        key: "hsk4",
        file: "hsk4.html",
        label: "HSK 4",
        range: "Từ vựng 1001 - 2000"
    },

    {
        key: "hsk5",
        file: "hsk5.html",
        label: "HSK 5",
        range: "Từ vựng 2001 - 3600"
    },

    {
        key: "hsk6",
        file: "hsk6.html",
        label: "HSK 6",
        range: "Từ vựng 3601 - 5400"
    },

    {
        key: "hsk7-9",
        file: "hsk7-9.html",
        label: "HSK 7-9",
        range: "Từ vựng 5401 - 11000"
    }

];


// =======================================================
// CACHE DANH SÁCH FILE
// =======================================================

let availableFilesCache = null;


// =======================================================
// LẤY DANH SÁCH FILE TỪ GITHUB
// =======================================================

async function fetchAvailableFiles() {

    if (availableFilesCache)
        return availableFilesCache;

    const api =
`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.folder}?ref=${GITHUB_CONFIG.branch}`;

    try {

        const response = await fetch(

            api,

            {
                cache: "no-store"
            }

        );

        if (!response.ok) {

            throw new Error(
                "GitHub API " + response.status
            );

        }

        const data =
            await response.json();

        availableFilesCache =
            new Set(

                data

                    .filter(
                        item => item.type === "file"
                    )

                    .map(
                        item =>
                        item.name.toLowerCase()
                    )

            );

        return availableFilesCache;

    }

    catch (error) {

        console.warn(

            "Không đọc được GitHub API.",

            error

        );

        availableFilesCache = null;

        return null;

    }

}
  // =======================================================
// LẤY DANH SÁCH HSK ĐƯỢC PHÉP HỌC
// auth.js sẽ gán:
// window.registeredLevels = ["hsk1","hsk2",...]
// =======================================================

async function checkUserAccessLevels() {

    if (!Array.isArray(window.registeredLevels)) {

        return new Set();

    }

    return new Set(

        window.registeredLevels.map(

            level =>

                String(level)

                    .trim()

                    .toLowerCase()

        )

    );

}



// =======================================================
// RENDER DASHBOARD
// =======================================================

function renderLevelGrid(

    availableFiles,

    registeredLevels

) {

    const grid =

        document.getElementById("level-grid");

    if (!grid)
        return;

    grid.innerHTML = "";



    LEVELS.forEach(level => {

        const fileExists =

            availableFiles === null ||

            availableFiles.has(

                level.file.toLowerCase()

            );



        const registered =

            registeredLevels.has(

                level.key.toLowerCase()

            );



        const card =

            document.createElement("div");



        let state = "";

        let badge = "";



        if (!fileExists) {

            state = "missing";

            badge = "🕐 Nội dung đang cập nhật";

        }

        else if (registered) {

            state = "unlocked";

            badge = "✓ Đã mở khóa";

        }

        else {

            state = "locked";

            badge = "🔒 Chưa đăng ký";

        }



        card.className =

            `card ${state}`;



        card.innerHTML =

        `

            <span class="badge">

                ${badge}

            </span>

            <h3>

                ${level.label}

            </h3>

            <p>

                ${level.range}

            </p>

        `;



        card.addEventListener(

            "click",

            () => {



                if (state === "missing") {

                    alert(

                        `${level.label} đang được cập nhật.`

                    );

                    return;

                }



                if (state === "locked") {

                    alert(

                        `Bạn chưa được cấp quyền học ${level.label}.`

                    );

                    return;

                }



                // Không dùng window.open()

                // Safari và Chrome iOS đôi khi chặn popup

                window.location.href =

                    PAGES_BASE_URL +

                    level.file;

            }

        );



        grid.appendChild(card);

    });

}
  // =======================================================
// KHỞI TẠO DASHBOARD
// =======================================================

let dashboardInitialized = false;

async function initDashboardOnce() {

    if (dashboardInitialized)
        return;

    dashboardInitialized = true;

    const grid =
        document.getElementById("level-grid");

    if (grid) {

        grid.innerHTML =
            '<div class="dash-loading">Đang tải danh sách cấp độ...</div>';

    }

    try {

        const availableFiles =
            await fetchAvailableFiles();

        const registeredLevels =
            await checkUserAccessLevels();

        // ===================================================
        // LẤY THÔNG TIN USER TỪ auth.js
        // ===================================================

        const nameElement =
            document.getElementById("dash-user-name");

        if (nameElement) {

            const currentUser = window.currentUser;

            if (currentUser) {

                nameElement.textContent =
                    currentUser.displayName ||
                    currentUser.email ||
                    "bạn";

            }

            else {

                nameElement.textContent = "bạn";

            }

        }

        renderLevelGrid(

            availableFiles,

            registeredLevels

        );

    }

    catch (error) {

        console.error(error);

        dashboardInitialized = false;

        if (grid) {

            grid.innerHTML =
                '<div class="dash-error">Không tải được Dashboard.</div>';

        }

    }

}



// =======================================================
// THEO DÕI ĐĂNG NHẬP
// =======================================================

const dashboardSection =

document.getElementById("dashboard-section");



const observer =

new MutationObserver(() => {

    const visible =

        dashboardSection.style.display !== "none";



    if (visible) {

        initDashboardOnce();

    }

    else {

        dashboardInitialized = false;

    }

});



observer.observe(

    dashboardSection,

    {

        attributes: true,

        attributeFilter: [

            "style"

        ]

    }

);



if (

    dashboardSection.style.display !== "none"

) {

    initDashboardOnce();

}
